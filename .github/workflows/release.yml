name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create zip
        run: zip -r jenkins-onboarding-extension-${{ github.ref_name }}.zip . -x '.git/*' '.github/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: jenkins-onboarding-extension-${{ github.ref_name }}.zip
